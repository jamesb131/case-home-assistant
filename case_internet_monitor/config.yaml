name: CASE Internet Monitor
version: "0.1.66"
slug: case_internet_monitor
description: Local PingPlotter-style latency, loss and HTTPS monitor.
url: https://github.com/jamesb131/case-home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: stable
init: false
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: Internet monitor UI/API
options:
  interval_seconds: 5
  targets_json: '[{"name":"1.1.1.1","host":"1.1.1.1","test_type":"ping"}]'
schema:
  interval_seconds: int(2,30)
  targets_json: str
map:
  - type: data
    read_only: false
image: ghcr.io/jamesb131/case-home-assistant/case-internet-monitor
webui: http://[HOST]:[PORT:8090]
