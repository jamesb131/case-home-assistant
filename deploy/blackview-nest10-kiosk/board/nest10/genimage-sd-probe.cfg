image sd-probe.vfat {
  vfat {
    label = "NEST_PROBE"
    extraargs = "-F 32"
    files = {
      "boot.scr.uimg",
      "boot.scr",
      "boot",
      "case-probe",
      "NEST_PROBE_VISIBLE",
      "README.txt"
    }
  }
  size = 64M
}

image nest10-sd-probe.img {
  hdimage {
    partition-table-type = "mbr"
  }

  partition probe {
    partition-type = 0x0c
    bootable = "true"
    image = "sd-probe.vfat"
    offset = 1M
  }
}
