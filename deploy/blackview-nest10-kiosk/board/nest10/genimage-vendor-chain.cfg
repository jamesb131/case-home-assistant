image boot.vfat {
  vfat {
    label = "CASE_BOOT"
    files = {
      "Image",
      "nest10.dtb",
      "extlinux",
      "case-kiosk.env.example"
    }
  }
  size = 96M
}

image nest10-vendor-chain.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition boot {
    partition-type-uuid = U
    partition-uuid = "4f8f7d79-2b55-4a65-8f6e-f37b272cda01"
    image = "boot.vfat"
    offset = 16M
    bootable = "true"
  }

  partition rootfs {
    partition-type-uuid = L
    partition-uuid = "4f8f7d79-2b55-4a65-8f6e-f37b272cda02"
    image = "rootfs.ext4"
  }
}

