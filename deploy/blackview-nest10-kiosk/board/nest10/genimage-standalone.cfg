image boot.vfat {
  vfat {
    label = "CASE_BOOT"
    files = {
      "Image",
      "nest10.dtb",
      "extlinux",
      "case-kiosk.env.example"
    }
  }
  size = 96M
}

image nest10-standalone.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition idbloader {
    in-partition-table = "no"
    image = "idbloader.img"
    offset = 32K
  }

  partition uboot {
    in-partition-table = "no"
    image = "u-boot.itb"
    offset = 8M
  }

  partition boot {
    partition-type-uuid = U
    partition-uuid = "4f8f7d79-2b55-4a65-8f6e-f37b272cda11"
    image = "boot.vfat"
    offset = 16M
    bootable = "true"
  }

  partition rootfs {
    partition-type-uuid = L
    partition-uuid = "4f8f7d79-2b55-4a65-8f6e-f37b272cda12"
    image = "rootfs.ext4"
  }
}

